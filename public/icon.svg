<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="glow-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#glow-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#cyber-grad)" stroke-width="6" opacity="0.6" />
  
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.2" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" />
  
  <!-- Pulse wave -->
  <path d="M 60 256 L 150 256 L 190 140 L 235 370 L 280 180 L 320 310 L 360 256 L 452 256" 
        fill="none" stroke="url(#cyber-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Center pulse node -->
  <circle cx="256" cy="256" r="16" fill="#06b6d4" />
  <circle cx="256" cy="256" r="32" fill="#06b6d4" opacity="0.3" />
</svg>
